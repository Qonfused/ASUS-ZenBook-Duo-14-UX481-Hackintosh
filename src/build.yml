---
version: latest
build: DEBUG
---
ACPI:
  SSDT-ALSD: "ACPI/SSDT-ALSD.dsl"
  SSDT-ATKD: "ACPI/SSDT-ATKD.dsl"
  SSDT-AWAK: "ACPI/SSDT-AWAC.dsl"
  SSDT-DGPU: "ACPI/SSDT-DGPU.dsl"
  SSDT-EC-USBX: "ACPI/SSDT-EC-USBX.dsl"
  SSDT-GPIO: "ACPI/SSDT-GPIO.dsl"
  SSDT-GPRW: "ACPI/SSDT-GPRW.dsl"
  SSDT-KBLC: "ACPI/SSDT-KBLC.dsl"
  SSDT-PLUG: "ACPI/SSDT-PLUG.dsl"
  SSDT-PNLF: "ACPI/SSDT-PNLF.dsl"
  SSDT-SBUS-MCHC: "ACPI/SSDT-SBUS-MCHC.dsl"
Drivers:
  - HfsPlus
@ifdef(RELEASE)
  - OpenCanopy
@endif
  - OpenRuntime
  - ResetNvramEntry
  # Required for booting from built-in microSD reader
  - Rts5227S
Kexts:
  Lilu: latest
  WhateverGreen: latest
  AppleALC: latest
  # VirtualSMC + plugins
  VirtualSMC: latest
  AsusSMC: Qonfused/AsusSMC=1.5.2
  SMCBatteryManager: "*"
  SMCProcessor: "*"
  SMCSuperIO: "*"
  # Wi-Fi / Bluetooth
  AirportItlwm-Sonoma14.4:
    specifier: OpenIntelWireless/itlwm=2.3.0
    build: RELEASE
    properties:
      MaxKernel: "23.99.99"
      MinKernel: "23.4.0"
  AirportItlwm-Sonoma14.0:
    specifier: OpenIntelWireless/itlwm=2.3.0
    build: RELEASE
    properties:
      MaxKernel: "23.3.99"
      MinKernel: "23.0.0"
  AirportItlwm-Ventura:
    specifier: OpenIntelWireless/itlwm=2.3.0
    build: RELEASE
    properties:
      MaxKernel: "22.99.99"
      MinKernel: "22.0.0"
  AirportItlwm-Monterey:
    specifier: OpenIntelWireless/itlwm=2.3.0
    build: RELEASE
    properties:
      MaxKernel: "21.99.99"
      MinKernel: "21.0.0"
  AirportItlwm-BigSur:
    specifier: OpenIntelWireless/itlwm=2.3.0
    build: RELEASE
    properties:
      MaxKernel: "20.99.99"
      MinKernel: "20.0.0"
  AirportItlwm-Catalina:
    specifier: OpenIntelWireless/itlwm=2.3.0
    build: RELEASE
    properties:
      MaxKernel: "19.99.99"
      MinKernel: "19.0.0"
  BlueToolFixup:
    specifier: acidanthera/BrcmPatchRAM=latest
    properties:
      MinKernel: "21.0.0"
  IntelBluetoothFirmware: OpenIntelWireless/IntelBluetoothFirmware=latest
  IntelBluetoothInjector:
    specifier: "*"
    properties:
      MaxKernel: "20.99.99"
  IntelBTPatcher: "*"
  # Misc. Lilu plugins
  AzureWaveUVCFix: Qonfused/AzureWaveUVCFix=latest
  CpuTscSync: latest
  DuoLink:
    specifier: Qonfused/DuoLink=latest
    bundled:
      - DuoLinkTouch
  DuoLinkTouch:
    specifier: "*"
  DiskArbitrationFixup: Qonfused/DiskArbitrationFixup=latest
  ECEnabler: 1Revenger1/ECEnabler=latest
  FeatureUnlock: latest
  HibernationFixup: latest
  NVMeFix: latest
  RealtekCardReader: 0xFireWolf/RealtekCardReader=latest
  RealtekCardReaderFriend: 0xFireWolf/RealtekCardReaderFriend=latest
  RestrictEvents: latest
  # Misc. non-Lilu kexts
  USBToolBox: USBToolbox/kext=latest
  UTBMap: "Kexts/UTBMap.kext"
  # Voodoo kexts + plugins
  # DuoLink hooks support the official 2.9.1 RELEASE core and HID binaries.
  VoodooI2C:
    specifier: Qonfused/VoodooI2C=2.9.1
    build: RELEASE
    bundled:
      - VoodooI2CServices
      - VoodooInput
  VoodooI2CHID:
    specifier: Qonfused/VoodooI2CHID=2.9.1
    build: RELEASE
  # Upstream 44fc744 includes GPIO corrections absent from the 2.9.1 release.
  VoodooGPIO:
    specifier: Qonfused/VoodooI2C=2.9.1
    build: RELEASE
  VoodooPS2Controller:
    specifier: acidanthera/VoodooPS2=latest
    bundled:
      - VoodooPS2Keyboard
  VoodooInjector: Qonfused/VoodooInjector=latest
Tools:
  # Also known as UEFIShell
  - OpenShell
  # Required for unlocking CFG-Lock
  - ControlMsrE2
